# --- General Settings ---
# Use Zsh as the default shell
set-option -g default-shell /bin/zsh

# Improve colors for Kanagawa (supports true color)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Increase scrollback buffer (great for long CUDA compile logs)
set -g history-limit 10000

# Set the prefix to Ctrl-a (easier to reach than Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support (scroll, click panes, resize)
set -g mouse on

# Start windows/panes at 1 (0 is too far away)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Zero escape delay (critical for Neovim)
set -sg escape-time 0

# Focus events (needed for Neovim autoread)
set -g focus-events on

# Longer display time for messages
set -g display-time 2000

# --- Navigation (vim-tmux-navigator) ---
# Smart pane switching: detects if Vim is running and sends keys
# to Vim instead of tmux when appropriate.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Also support navigation in copy-mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Fallback: prefix + hjkl still works
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Splits & Windows ---
# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in current path
bind c new-window -c "#{pane_current_path}"

# Resize panes with prefix + HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy Mode (Vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Quick Reload ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Aesthetics (Kanagawa Wave Palette) ---
set -g status-position bottom
set -g status-interval 5
set -g status-style bg='#1F1F28',fg='#DCD7BA'        # sumiInk1 / oldWhite
set -g pane-border-style fg='#2A2A37'                 # sumiInk3
set -g pane-active-border-style fg='#7E9CD8'          # crystalBlue
set -g message-style bg='#2A2A37',fg='#DCD7BA'        # sumiInk3 / oldWhite
set -g message-command-style bg='#2A2A37',fg='#DCD7BA'

# Status left: session name
set -g status-left-length 30
set -g status-left "#[fg=#1F1F28,bg=#7E9CD8,bold]  #S #[bg=#1F1F28] "

# Status right: host + time
set -g status-right-length 50
set -g status-right "#[fg=#727169] #H  #[fg=#1F1F28,bg=#938AA9,bold] %H:%M "

# Window tabs
setw -g window-status-format "#[fg=#727169] #I:#W "
setw -g window-status-current-format "#[fg=#1F1F28,bg=#E6C384,bold] #I:#W "

# Copy-mode highlight
setw -g mode-style bg='#2D4F67',fg='#DCD7BA'         # waveBlue2 / oldWhite
